[project]
name = "job-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "anishpandey1232@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "grandalf>=0.8",
    "langchain>=1.4.3",
    "langchain-core>=1.6.7",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.7",
    "langfuse>=4.17.0",
    "openai>=3.28.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
]

[project.scripts]
job-agent = "job_agent:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
